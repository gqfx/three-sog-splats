<!doctype html>
<html lang="en">
  <head>
    <title>three.js webgpu - SOG loader</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="Native SOG v2 Gaussian splat loading with Three.js WebGPU and WebGL backends." />
    <link rel="stylesheet" href="/three-example.css" />
  </head>
  <body>
    <div id="info">
      <div class="title-wrapper">
        <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>
        <span>SOG Loader</span>
      </div>
      <small id="status">Initializing renderer…</small>
      <small id="performance-summary">Measuring frame rate…</small>
      <small id="analysis-summary">Run the controlled profiler to identify the slow stage.</small>
      <small id="license"></small>
    </div>

    <section id="controls" aria-label="Example controls">
      <label>
        SOG source
        <select id="source">
          <option value="no-sh">Millipede · full 116K · no SH</option>
          <option value="sh">Lion · full 195K · SH2</option>
          <option value="lion-grid-5m">Lion grid · 25 runtime copies · 4.88M · SH2</option>
          <option value="stress-5m">Synthetic lattice · 5,000,000 · WebGPU stress</option>
        </select>
      </label>
      <label>
        Three.js backend
        <select id="backend">
          <option value="webgpu">WebGPU</option>
          <option value="webgl">WebGL fallback</option>
        </select>
      </label>
      <button id="motion" type="button">Start motion test</button>
      <button id="analyze" type="button" disabled>Analyze bottleneck</button>
    </section>

    <pre id="diagnostics" aria-live="polite"></pre>
    <script type="module" src="/webgpu-sog.ts"></script>
  </body>
</html>
