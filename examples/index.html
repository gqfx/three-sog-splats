<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-sog-splats MVP</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="viewport"></main>
    <aside>
      <h1>three-sog-splats</h1>
      <p id="status">Starting…</p>

      <div class="actions">

      <p class="hint">Drag to orbit. Add <code>?backend=webgl&amp;fixture=sh</code> to select the fallback and SH fixture.</p>
    </aside>
    <script type="module" src="/main.ts"></script>
  </body>
